# Two independent SQL Server instances simulating two different servers.
# If you already have a SQL Server container, reuse it as DEV and start only sqlserver-prd.
services:
  sqlserver-dev:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sqlserver-dev
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${DEV_SA_PASSWORD}
    ports:
      - "14331:1433"
    volumes:
      - sqlserver-dev-data:/var/opt/mssql
    networks: [net-dev]

  sqlserver-prd:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sqlserver-prd
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${PRD_SA_PASSWORD}
    ports:
      - "14332:1433"
    volumes:
      - sqlserver-prd-data:/var/opt/mssql
    networks: [net-prd]

volumes:
  sqlserver-dev-data:
  sqlserver-prd-data:

networks:
  net-dev: {}
  net-prd: {}
